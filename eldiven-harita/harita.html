<title>Eldiven haritası</title>
<link rel="stylesheet" href="../vendor/eldiven-font/font.css">
<style>
 
:root{
  --bg:#060B14; --panel:rgba(10,18,32,.9); --panel-solid:#0B1424; --line:#1C2B42; --fg:#E8EEF6; --muted:#8C9CB4; --dim:#5E6F88;
  --transit:#35B6EE; --port:#F2A93B; --late:#F2564F; --bond:#A68CFF; --done:#3CCB98; --wait:#7C8BA3; --hold:#C77D96;
  --land:#2A4566; --ocean:#0A1628; --glow:#2F8FD0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--transit);outline-offset:2px}
#app{position:relative;height:100%}
#stage{position:absolute;inset:0;overflow:hidden}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.plabel{position:absolute;transform:translate(8px,-50%);font:600 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-shadow:0 1px 3px #000}
.plabel::before{content:"";position:absolute;left:-8px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--muted)}
.plabel.tr{color:var(--fg)}
.plabel.tr::before{background:var(--port)}
.gm{touch-action:none;position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 7px;border-radius:13px;border:2px solid rgba(255,255,255,.85);color:#06101d;font:700 13px/22px var(--f-display);text-align:center;cursor:pointer;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.55);white-space:nowrap}
.gm:hover,.gm[aria-current="true"]{transform:translate(-50%,-50%) scale(1.18);border-color:#fff}
.gm.ship::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-4px;border:4px solid transparent;border-top-color:rgba(255,255,255,.85)}

#panel{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));bottom:92px;width:360px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);overflow-y:auto;overscroll-behavior:contain}
.ph{flex:none}
.ph{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.toprow{display:none}
.eyebrow{font:600 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--transit)}
h1{margin:0;font:700 28px/1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 9px;font:600 12px/1 var(--f-display);letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.asof{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:8px 8px 7px;display:grid;gap:3px;cursor:pointer;text-align:left}
.kpi[aria-pressed="false"]{opacity:.45}
.kpi .n{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .l i{width:8px;height:8px;border-radius:2px;flex:none}
.kpi .s{font:500 10px/1.2 var(--f-mono);color:var(--dim)}
.alert{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--late) 14%,transparent);border:1px solid color-mix(in srgb,var(--late) 40%,transparent);border-radius:6px;padding:7px 9px;font-size:12px}
.alert b{font:700 16px/1 var(--f-display);color:var(--late)}
#q{width:100%;background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);font:500 13px var(--f-body)}
#q::placeholder{color:var(--dim)}
#list{flex:none;padding:4px 8px 12px}
.gh{position:sticky;top:0;background:var(--panel-solid);display:flex;justify-content:space-between;align-items:baseline;padding:10px 8px 6px;font:700 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);z-index:1}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:2px 10px;align-items:center;width:100%;background:none;border:0;border-radius:6px;padding:7px 8px;text-align:left;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.row[aria-current="true"]{background:color-mix(in srgb,var(--transit) 16%,transparent)}
.row .pip{grid-row:span 2;width:4px;height:100%;border-radius:2px}
.row .r1{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r2{font:500 11px var(--f-mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{grid-row:span 2;font:600 13px/1.15 var(--f-display);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .m.late{color:var(--late)}
.empty{padding:20px 10px;color:var(--muted);font-size:13px;line-height:1.5}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:7px 8px;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:600 12px/1 var(--f-display);letter-spacing:.06em;color:var(--muted);justify-self:start}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gstats div{background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:7px 8px;display:grid;gap:3px;min-width:0}
.gstats b{font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gstats span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11px;background:var(--panel-solid);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.warn{font-size:12px;border-left:3px solid var(--late);background:var(--panel-solid);padding:6px 9px;border-radius:3px}
.glist{display:grid;gap:2px;margin:0 -8px}
.pv{display:grid;gap:14px;padding:8px 8px 4px}
.pv h4{margin:0 0 6px;font:700 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ubar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.ubar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:8px;font-size:12px}
.leg>div{display:flex;gap:6px;align-items:flex-start;min-width:0}
.leg>div>div{display:block;min-width:0}
.leg b{white-space:nowrap}
.leg i{width:9px;height:9px;border-radius:2px;margin-top:3px;flex:none}
.leg b{display:block;overflow-wrap:anywhere;font:700 15px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.leg span{color:var(--muted);font-size:11px}
.wk{display:flex;align-items:flex-end;gap:4px;height:96px;padding-top:14px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.wk i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:2px}
.wk em{font:500 9px/1 var(--f-mono);font-style:normal;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.wk span{font:500 9px/1.2 var(--f-mono);color:var(--dim);margin-top:4px;white-space:nowrap}
.sup{display:grid;gap:7px}
.sup div{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.sup .bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line)}
.sup .bar i{display:block;height:100%}
.sup span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup b{font:600 12px var(--f-mono);font-variant-numeric:tabular-nums}

#timeline{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 376px);right:max(16px,env(safe-area-inset-right,0px));bottom:16px;height:60px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;backdrop-filter:blur(8px)}
#play,#today{flex:none;background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;height:34px;padding:0 12px;cursor:pointer;font:600 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
#play{width:40px;padding:0;display:grid;place-items:center}
#date{flex:none;font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:118px}
.track{flex:1;min-width:0;position:relative}
#t{width:100%;accent-color:var(--transit)}
.ticks{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:var(--dim);margin-top:2px}

#card{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));width:380px;max-height:calc(100% - 108px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
.ch{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px;position:sticky;top:0;background:var(--panel-solid)}
.ch .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch h2{margin:0;font:700 24px/1 var(--f-display)}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;flex:none}
.iso{font:500 17px/1 var(--f-mono);letter-spacing:.04em}
.iso b{display:inline-block;margin-left:3px;padding:1px 4px;border:1px solid var(--muted);border-radius:3px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--line)}
.pill i{width:8px;height:8px;border-radius:2px}
.cs{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.cs:last-child{border-bottom:0}
.cs h3{margin:0;font:700 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.lots{width:100%;border-collapse:collapse;font-size:12px}
.lots th{text-align:left;font-weight:500;color:var(--muted);padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.lots td{padding:5px 6px 5px 0;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.lots td.r,.lots th.r{text-align:right}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.sizes span{font:500 11px var(--f-mono);background:var(--panel-solid);border:1px solid var(--line);border-radius:3px;padding:2px 5px}
.legs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legs li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:12px}
.legs li::before{content:"";width:8px;height:8px;margin:4px 3px;border-radius:50%;border:2px solid var(--dim)}
.legs li.done::before{background:var(--dim)}
.legs li.now::before{border-color:var(--transit);background:var(--transit);box-shadow:0 0 0 3px color-mix(in srgb,var(--transit) 30%,transparent)}
.legs .v{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.note{font-size:12px;color:var(--fg);background:var(--panel-solid);border-left:3px solid var(--port);padding:6px 9px;border-radius:3px}
.src{font-size:11px;color:var(--dim);line-height:1.45}

@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;padding-bottom:16px}
  #stage{order:1} #timeline{order:2} #panel{order:3}
  .kpi .n{font-size:20px}
  .plabel{font-size:10px}
  #stage{position:relative;height:56vh;min-height:320px}
  #panel{position:relative;inset:auto;width:auto;margin:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-height:none}
  #list{max-height:none;overflow:visible}
  #timeline{position:relative;inset:auto;margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));height:auto;padding:10px 12px;flex-wrap:wrap}
  .track{flex-basis:100%;order:3}
  #card{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto;max-height:62vh;z-index:5}
  h1{font-size:24px}
}
#panel{overflow-x:hidden}
.pv{min-width:0}
@media (max-width:400px){ .wk{gap:2px} .leg b{font-size:13px} .sup div{grid-template-columns:68px minmax(0,1fr) auto;gap:6px} .wk em{font-size:8px} }
@media (pointer:coarse){ .gm{min-width:32px;height:32px;border-radius:16px;font-size:14px;line-height:28px} .x{width:40px;height:40px} .lang button{padding:9px 12px} .seg button{padding:11px 8px} #play,#today{height:40px} }
.nogl{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);max-width:300px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;padding:14px 16px;border:1px dashed var(--line);border-radius:10px}
@media (min-width:861px){ .nogl{left:calc(50% + 190px)} }
@media (max-width:860px){ #app.nogl-on #stage{height:120px;min-height:0} .nogl{top:50%} }
 
@media (max-width:860px){
  html,body{height:auto;min-height:100%}
  #panel,#list{overflow:visible;overflow-x:clip;overscroll-behavior:auto}
  #panel,#timeline,#card{-webkit-backdrop-filter:none;backdrop-filter:none}
  #panel{background:var(--panel-solid)}
}
@media (pointer:coarse){ #stage canvas,.gm{touch-action:pan-y} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}.seg{flex-wrap:wrap}.seg button{flex:1 1 30%;min-width:0}.ocard{background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}.ocard .gstats{grid-template-columns:repeat(5,1fr)}@media (max-width:400px){.ocard .gstats{grid-template-columns:repeat(3,1fr)}}
</style>

<div id="app">
  <div id="stage" aria-label="3D globe"><div id="labels"></div></div>

  <aside id="panel">
    <div class="ph">
      <div class="toprow">
        <div class="eyebrow" data-i="eyebrow">MY Medikal</div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-tr" data-lang="tr" aria-pressed="true">TR</button>
          <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <h1 data-i="title">Eldiven Haritası</h1>
      <div class="asof" id="asof" data-i="loading">Veriler yükleniyor…</div>
      <div class="kpis" id="kpis"></div>
      <div class="kpis" id="finkpi" style="grid-template-columns:1fr 1fr" hidden></div>
      <div class="alert" id="alert" hidden></div>
      <input id="q" type="search" autocomplete="off" data-ph="search" placeholder="Konteyner, referans, müşteri ara">
      <div class="seg" role="group" aria-label="View"><button type="button" id="v-ktr" aria-pressed="true" data-i="vKtr">Konteynerler</button><button type="button" id="v-grp" aria-pressed="false" data-i="vGrp">Gemiler ve limanlar</button><button type="button" id="v-ozet" aria-pressed="false" data-i="vOzet">Özet</button><button type="button" id="v-fiy" aria-pressed="false" data-i="vFiy" hidden>Fiyat listesi</button><button type="button" id="v-pay" aria-pressed="false" data-i="vPay" hidden>Ödemeler</button></div>
    </div>
    <div id="list"><div class="empty" id="empty" data-i="emptyLoading">Konteyner kayıtları yükleniyor. Haritada limanlar ve rotalar görünür; konteynerler veri geldiğinde eklenir.</div></div>
  </aside>

  <div id="timeline">
    <button type="button" id="play" aria-label="Oynat / Play">▶</button>
    <div id="date">—</div>
    <div class="track">
      <input type="range" id="t" min="46204" max="46372" step="1" value="46318" aria-label="Tarih / Date">
      <div class="ticks" id="ticks"></div>
    </div>
    <button type="button" id="today" data-i="today">Bugün</button>
  </div>

  <div id="card" hidden></div>
</div>

<script src="../web-koruma.js"></script>
<script src="echarts-shim.js"></script>
<script src="../vendor/echarts-world.js"></script>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script src="harita.js"></script>

</body></html>
